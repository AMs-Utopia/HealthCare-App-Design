org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot release its cache files on this Windows
# setup - every build of the image_picker_android module died with "Could not
# close incremental caches ... class-fq-name-to-source.tab", and a full
# flutter clean did not help, because the caches are rebuilt and re-locked on
# each run. Turning incremental compilation off only costs a little rebuild
# speed in the plugin modules; nothing about the app itself changes.
kotlin.incremental=false
